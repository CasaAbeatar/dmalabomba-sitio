name: Prueba de la app Sinpe 2.12.0 con targetSdk 34 (servicio specialUse, receptor con bandera, actualizacion silenciosa) en Android 13 a 16
on:
  workflow_dispatch:
    inputs:
      solo_pulsador:
        description: 'Poner 1 para repetir solo el paso 8 (confirmacion forzada + pulsador de accesibilidad)'
        required: false
        default: ''
  push:
    branches: [prueba-guardian-27-t34]
jobs:
  android:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        api: [33, 34, 35, 36]
    defaults:
      run:
        working-directory: app sms android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: prueba-app-sms
          path: viejo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          build-root-directory: app sms android
      - name: Pruebas unitarias (JVM)
        run: gradle testDebugUnitTest
      - name: Construir el APK 2.12.0 (targetSdk 34) y el 2.6.0 (para probar la actualizacion encima)
        run: |
          gradle assembleDebug
          cd "../viejo/app sms android"
          gradle assembleDebug -p .
          cp app/build/outputs/apk/debug/app-debug.apk ../../viejo-2.6.0.apk
          grep -E 'versionCode|versionName' app/build.gradle
          cd "$GITHUB_WORKSPACE/app sms android"
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-2-12-0-t34.sha256
      - uses: actions/upload-artifact@v4
        if: matrix.api == 33
        with:
          name: apk-2-12-0-t34
          path: |
            app sms android/app/build/outputs/apk/debug/app-debug.apk
            app sms android/apk-2-12-0-t34.sha256
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador (de punta a punta con servidor falso, y pruebas instrumentadas)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          working-directory: app sms android
          script: |
            bash ../scripts-prueba/guardian-e2e.sh
            bash ../scripts-prueba/t34-arranque.sh
            mkdir -p e2e-resultados
            for f in guardian-*.png guardian-*.txt guardian-*.xml guardian-recibidos.jsonl t34-*.txt; do [ -f "$f" ] && cp "$f" e2e-resultados/; done
            adb uninstall tech.bogomolov.incomingsmsgateway
            adb shell settings put global hide_error_dialogs 1
            adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null; adb shell input keyevent KEYCODE_HOME
            gradle connectedDebugAndroidTest
            [ "$(cat t34-rc.txt 2>/dev/null || echo 1)" = "0" ] || { echo 'FALLA: prueba de arranque targetSdk 34'; exit 1; }
            exit $(cat guardian-rc.txt 2>/dev/null || echo 1)
      - name: Emulador limpio (modo telefono dedicado, Device Owner, reinicio remoto)
        if: always() && matrix.api == 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          working-directory: app sms android
          script: |
            mkdir -p do-resultados
            bash ../scripts-prueba/guardian-do.sh
            for f in guardian-do-*.txt guardian-do-*.png guardian-estado.xml guardian-resultado.txt guardian-logcat.txt guardian-recibidos.jsonl; do [ -f "$f" ] && cp "$f" "do-resultados/$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-guardian-dedicado-api${{ matrix.api }}
          path: app sms android/do-resultados
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-guardian-api${{ matrix.api }}
          path: |
            app sms android/e2e-resultados
            app sms android/app/build/reports/androidTests/connected
            app sms android/app/build/outputs/androidTest-results/connected
            app sms android/app/build/reports/tests/testDebugUnitTest
  actualizacion:
    name: Actualizacion automatica real, API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        api: [33, 34, 35, 36]
    defaults:
      run:
        working-directory: app sms android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          build-root-directory: app sms android
      - name: Construir las versiones de prueba (mismo certificado de depuracion) y una firmada con OTRO certificado
        run: |
          mkdir -p act-apks
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk act-apks/apk-22.apk
          gradle assembleDebug -PvcPrueba=23 -PvnPrueba=2.12.1
          cp app/build/outputs/apk/debug/app-debug.apk act-apks/apk-23.apk
          gradle assembleDebug -PvcPrueba=24 -PvnPrueba=2.12.2
          cp app/build/outputs/apk/debug/app-debug.apk act-apks/apk-24.apk
          gradle assembleDebug -PvcPrueba=27 -PvnPrueba=2.12.3
          cp app/build/outputs/apk/debug/app-debug.apk act-apks/apk-27.apk
          gradle assembleDebug -PvcPrueba=28 -PvnPrueba=2.12.4
          cp app/build/outputs/apk/debug/app-debug.apk act-apks/apk-28.apk
          keytool -genkeypair -keystore otra.jks -alias otra -keyalg RSA -keysize 2048 -validity 3650 -storepass pruebaprueba -keypass pruebaprueba -dname "CN=Otro Certificado"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER sign --ks otra.jks --ks-pass pass:pruebaprueba --key-pass pass:pruebaprueba --out act-apks/apk-24-otra.apk act-apks/apk-24.apk
          rm act-apks/apk-24.apk
          ls -la act-apks
          for f in act-apks/*.apk; do echo "$f"; $APKSIGNER verify --print-certs "$f" | grep -m1 "SHA-256"; done
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador (autochequeo, ADB a pedido y actualizacion automatica real)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          working-directory: app sms android
          script: |
            adb shell settings put global hide_error_dialogs 1
            SOLO_PULSADOR='${{ inputs.solo_pulsador }}' bash ../scripts-prueba/actualizacion-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-actualizacion-api${{ matrix.api }}
          path: |
            app sms android/act-resultado.txt
            app sms android/act-recibidos.jsonl
            app sms android/act-descargas.log
            app sms android/act-logcat.txt
            app sms android/act-logcat-actualizador.txt
            app sms android/act-final.png

