name: Prueba del kit de caja en Windows
on:
  workflow_dispatch:
  push:
    branches: [kit-v3-18nov, kit-v3-6-21nov]
    paths: ['kit pc caja/**', 'pruebas windows/probar kit v3.ps1', '.github/workflows/prueba-kit-caja.yml']
permissions:
  contents: write
jobs:
  kit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probar el kit con Windows PowerShell 5.1
        shell: powershell
        working-directory: pruebas windows
        run: ./"probar kit v3.ps1"
      - name: Chrome real con las directivas del kit v3.6 lee la publicidad local desde el subdominio
        if: always()
        shell: pwsh
        working-directory: pruebas windows
        continue-on-error: true
        run: |
          Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like "*servidor publicidad*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          . "C:\PantallaCliente\config.ps1"
          New-Item -ItemType Directory -Force (Join-Path $CarpetaPublicidad "Soda") | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $CarpetaPublicidad "Soda\prueba-chrome.png"), [byte[]](0x89, 0x50, 0x4E, 0x47, 0, 0, 0, 0))
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile -ExecutionPolicy Bypass -File "C:\PantallaCliente\servidor publicidad.ps1"'
          Start-Sleep -Seconds 6
          Get-ItemProperty "HKLM:\SOFTWARE\Policies\Google\Chrome\LocalNetworkAccessAllowedForUrls" | Format-List | Out-String | Write-Host
          npm init -y | Out-Null
          npm i playwright@1.49.1 | Out-Null
          node "prueba chrome subdominio.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-kit
          path: pruebas windows/resultados
      - name: Guardar el resultado en la rama resultados-kit-v3-6 (para leerlo sin la API)
        if: always()
        shell: pwsh
        run: |
          $carpeta = "${{ runner.temp }}/res"
          New-Item -ItemType Directory -Force $carpeta | Out-Null
          Copy-Item "pruebas windows/resultados/*" $carpeta -Recurse -ErrorAction SilentlyContinue
          Set-Content "$carpeta/commit.txt" "${{ github.sha }} rama ${{ github.ref_name }} resultado del paso de prueba: ${{ job.status }}"
          git config user.name "prueba-windows"
          git config user.email "prueba-windows@users.noreply.github.com"
          git fetch origin resultados-kit-v3-6 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout -f resultados-kit-v3-6 } else { git checkout --orphan resultados-kit-v3-6; git rm -rf . | Out-Null }
          if (Test-Path ultima) { Remove-Item ultima -Recurse -Force }
          Copy-Item $carpeta ultima -Recurse
          git add ultima
          git commit -m "Resultado de la prueba del kit v3.6 de ${{ github.sha }}" 2>$null
          git push origin resultados-kit-v3-6
