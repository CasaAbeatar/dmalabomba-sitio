name: Prueba del paquete de comandos del telefono de la Soda (emulador)
on:
  workflow_dispatch:
  push:
    branches: [prueba-paquete-soda]
jobs:
  android:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 31, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Bajar el APK publicado en el sitio real
        run: |
          curl -fsSL --retry 3 -o apk-real.apk https://pagos.dmalabomba.com/instalar/reenviador-sms-la-bomba-2.12.1.apk
          sha256sum apk-real.apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador y paquete de comandos
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          script: bash paquete-soda/prueba-emulador.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-paquete-soda-api${{ matrix.api }}
          path: |
            resultados
