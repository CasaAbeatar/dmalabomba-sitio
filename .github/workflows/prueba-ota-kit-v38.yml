name: Prueba del kit v3.8 (origenes alternos y contingencia) en Windows
on:
  workflow_dispatch:
  push:
    branches: [kit-ota-v38]
    paths: ['kit pc caja/v3.8*/**', 'ota-kit/**', 'pruebas windows/**', '.github/workflows/prueba-ota-kit-v38.yml']
jobs:
  ota:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Probar el actualizador v3.8 (origenes alternos, corte de DNS, reversion) y la contingencia con Windows PowerShell 5.1
        shell: powershell
        run: ./ota-kit/pruebas/probar-ota-v38.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-ota-v38
          path: ota-kit/pruebas/resultados
  kit:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Probar el kit v3.8 completo, cuenta normal y supervisor con el DNS del facturador cortado (Windows PowerShell 5.1)
        shell: powershell
        working-directory: pruebas windows
        run: ./"probar kit v3.8.ps1"
      - name: Chrome real, parte 1 - el facturador guarda su copia con internet
        if: always()
        shell: pwsh
        working-directory: pruebas windows
        run: |
          npm init -y | Out-Null
          npm i playwright@1.49.1 | Out-Null
          node "prueba chrome contingencia.mjs" preparar C:\perfil-sw
      - name: La deteccion de la copia guardada (Windows PowerShell 5.1) acierta con el perfil REAL de Chrome
        if: always()
        shell: powershell
        run: |
          $kit = (Get-ChildItem "kit pc caja" -Directory | Where-Object { $_.Name -like "v3.8*" } | Select-Object -First 1).FullName
          . "$kit\funciones contingencia.ps1"
          $a = Perfil-Tiene-Copia "C:\perfil-sw" "localhost"
          $b = Perfil-Tiene-Copia "C:\perfil-sw" "facturacion.dmalabomba.com"
          New-Item -ItemType Directory -Force C:\perfil-sw-vacio | Out-Null
          $c = Perfil-Tiene-Copia "C:\perfil-sw-vacio" "localhost"
          Write-Host "perfil con copia (localhost): $a ; mismo perfil otro dominio: $b ; perfil vacio: $c"
          Get-ChildItem "C:\perfil-sw\Default\Service Worker" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 25 | ForEach-Object { Write-Host ("   " + $_.FullName + " " + $_.Length) }
          if (-not $a -or $b -or $c) { throw "La deteccion de copia no acerto con el perfil real de Chrome" }
      - name: Chrome real, parte 2 - sin servidor el perfil con copia abre el facturador y el perfil nuevo no
        if: always()
        shell: pwsh
        working-directory: pruebas windows
        run: node "prueba chrome contingencia.mjs" offline C:\perfil-sw
      - name: Chrome real, parte 3 - la pantalla de contingencia del servidor local vuelve sola al facturador
        if: always()
        shell: pwsh
        working-directory: pruebas windows
        run: |
          Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like "*servidor publicidad*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile -ExecutionPolicy Bypass -File "C:\PantallaCliente\servidor publicidad.ps1"'
          Start-Sleep -Seconds 8
          curl.exe -s -m 10 -i http://127.0.0.1:8766/salud
          Write-Host ""
          curl.exe -s -m 10 -i http://127.0.0.1:8766/contingencia/ | Select-Object -First 8
          node "prueba chrome contingencia.mjs" pagina C:\perfil-pagina
          $codigo = $LASTEXITCODE
          Get-Content C:\PantallaCliente\datos\arranque.txt, C:\PantallaCliente\datos\registro.txt -ErrorAction SilentlyContinue | Select-Object -Last 20
          exit $codigo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-kit-v38
          path: pruebas windows/resultados
