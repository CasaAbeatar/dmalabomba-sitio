name: APK de produccion (app de SMS, sin firmar)
on:
  workflow_dispatch:
  push:
    branches: [prueba-guardian-27]
    paths: ['.github/workflows/apk-release-sms.yml']
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app sms android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          build-root-directory: app sms android
      - name: Construir el APK de produccion (sin firmar, no depurable)
        run: gradle assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app sms android/app/build/outputs/apk/release/*.apk
