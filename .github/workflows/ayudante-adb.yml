name: ayudante-adb (prueba con adb simulado)
on:
  push:
    branches: [ci-ayudante-adb-h]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del ayudante (PowerShell 7)
        shell: pwsh
        run: ./ayudante-adb/probar.ps1
      - name: Pruebas del ayudante (Windows PowerShell 5.1, el que trae la PC de la caja)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File ./ayudante-adb/probar.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
