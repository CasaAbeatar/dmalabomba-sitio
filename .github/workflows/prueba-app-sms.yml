name: Prueba de la app de SMS (SINPE) en Android
on:
  workflow_dispatch:
  push:
    branches: [prueba-app-sms]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app sms android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: app sms android
      - name: Pruebas unitarias (JVM)
        run: ./gradlew testDebugUnitTest
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Construir el APK de depuracion
        run: ./gradlew assembleDebug
      - name: Emulador Android 13 (pruebas instrumentadas y SMS de prueba)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          working-directory: app sms android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant tech.bogomolov.incomingsmsgateway android.permission.RECEIVE_SMS
            adb shell pm grant tech.bogomolov.incomingsmsgateway android.permission.POST_NOTIFICATIONS
            adb shell am start -n tech.bogomolov.incomingsmsgateway/.MainActivity
            sleep 6
            adb exec-out screencap -p > pantalla-inicial.png
            adb logcat -c
            adb emu sms send BCR "Recibiste un SINPE Movil por 5000 colones de JUAN PEREZ. Detalle: prueba"
            sleep 6
            adb logcat -d > registro-android.txt
            adb exec-out screencap -p > pantalla-final.png
            ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-android
          path: |
            app sms android/pantalla-inicial.png
            app sms android/pantalla-final.png
            app sms android/registro-android.txt
            app sms android/app/build/reports/androidTests/connected
            app sms android/app/build/reports/tests/testDebugUnitTest
