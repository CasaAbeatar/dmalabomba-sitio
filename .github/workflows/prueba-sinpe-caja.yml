name: Prueba SINPE (caja y Caja para mí)
on:
  workflow_dispatch:
  push:
    branches: ['admin-sinpe', 'revision-sinpe-*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cuentas y textos de «Caja para mí» (node)
        shell: pwsh
        working-directory: pruebas windows
        run: node --test "prueba sinpe caja calculos.mjs"
      - name: SINPE en la caja, lógica y emisor de la pantalla del cliente (node)
        shell: pwsh
        working-directory: pruebas windows
        run: node "prueba sinpe unidad.mjs"
      - name: Preparar Playwright
        shell: pwsh
        working-directory: pruebas windows
        run: |
          npm init -y | Out-Null
          npm i playwright@1.49.1 | Out-Null
          Copy-Item ../facturacion ./facturacion -Recurse
      - name: «Caja para mí» en Chrome (computadora y celular, datos inventados)
        shell: pwsh
        working-directory: pruebas windows
        run: node "prueba sinpe caja admin.mjs"
      - name: SINPE en la caja en Chrome (indicador, monto exacto, comprobante, pantalla del cliente)
        shell: pwsh
        working-directory: pruebas windows
        run: node "prueba sinpe caja.mjs"
      - name: Cobro y cierre de punta a punta con SINPE, permisos de la cajera y del administrador
        shell: pwsh
        working-directory: pruebas windows
        run: node "prueba sinpe cobro.mjs"
      - name: La caja de siempre sigue cargando en Chrome (prueba que ya existía)
        shell: pwsh
        working-directory: pruebas windows
        run: node prueba.mjs
      - name: Ver factura y Consultar con Claude (prueba que ya existía)
        shell: pwsh
        working-directory: pruebas windows
        run: node "prueba ayuda.mjs"
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-sinpe-caja
          path: pruebas windows/resultados
