apply plugin: 'com.android.application'

android {
    namespace 'tech.bogomolov.incomingsmsgateway'
    compileSdkVersion 34

    defaultConfig {
        applicationId "tech.bogomolov.incomingsmsgateway"
        // 2.11.0: firebase-messaging 23.x pide minSdk 19 (Android 4.4); el teléfono de la Soda y todo lo que se usa es muy posterior.
        minSdkVersion 19
        targetSdkVersion 33
        // 2.12.0: las pruebas de actualizacion automatica compilan una version posterior (-PvcPrueba=23 -PvnPrueba=2.12.1)
        // para que la app se actualice a si misma en el emulador; sin esas propiedades es 22 / 2.12.0.
        versionCode (project.hasProperty('vcPrueba') ? project.property('vcPrueba').toInteger() : 23)
        versionName (project.hasProperty('vnPrueba') ? project.property('vnPrueba') : "2.12.1")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Render the action-bar vector icons (e.g. the Settings gear) via the
        // support library so they work back to minSdkVersion 14.
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Let unmocked android.* calls (e.g. Log.e in error paths) return defaults
        // instead of throwing, so logic touching them stays JVM-unit-testable.
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    def work_version = "2.7.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.0.0'
    implementation 'androidx.navigation:navigation-ui:2.0.0'
    implementation "androidx.work:work-runtime:$work_version"
    implementation 'org.apache.commons:commons-text:1.9'
    // La Bomba 2.11.0: despertar por FCM. SIN el plugin google-services: FirebaseApp se inicia a mano (FcmInicio).
    implementation 'com.google.firebase:firebase-messaging:23.4.1'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:3.7.0'
    // La Bomba 2.7.0: org.json real para las pruebas JVM (el de android.jar es un esqueleto vacio).
    testImplementation 'org.json:json:20231013'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "org.mockito:mockito-android:3.7.0"
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation "androidx.work:work-testing:$work_version"
}
