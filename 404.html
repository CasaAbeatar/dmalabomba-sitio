<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Grupo DMA-La Bomba</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#fbf8f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#B81622;--amber:#F3A62C;--black:#171212;--white:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#fbf8f2;color:var(--black);font:300 17px/1.6 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.on-amber,.on-red{background:#fbf8f2;color:var(--black);--ln:rgba(23,18,18,.85);--lnsoft:rgba(23,18,18,.35)}
header.top{border-bottom:1px solid var(--ln)}
header.top .wrap{display:flex;align-items:center;justify-content:flex-end;height:64px}
.mark{font-weight:800;letter-spacing:.22em;font-size:14px;text-decoration:none}
header.top .right{display:flex;align-items:center;gap:28px}
header.top nav{display:flex;gap:26px;font-size:14px}
header.top .team{display:flex;gap:10px;font-size:13px}
header.top .team a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;border:1px solid var(--ln);border-radius:999px;padding:0 16px;letter-spacing:.04em}
header.top .team a:hover,header.top .team a:focus-visible{background:var(--black);color:#fbf8f2;border-color:var(--black)}
@media(max-width:700px){header.top nav{display:none}}
header.top nav a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;padding:0;border-bottom:1px solid transparent}
header.top nav a:hover,header.top nav a:focus-visible{border-color:var(--black)}
.hero{padding-top:clamp(72px,15vw,150px);padding-bottom:clamp(64px,12vw,120px)}
.eyebrow{font-weight:400;font-size:13px;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin:0 0 28px}
.eyebrow::before{content:"";width:40px;height:4px;background:var(--amber)}
h1{font-weight:300;font-size:clamp(42px,9vw,104px);line-height:1.02;letter-spacing:-.03em;margin:0 0 32px;max-width:12ch}
.nb{white-space:nowrap}
h1 em{font-style:normal;color:var(--red);font-weight:300}
.hero p{max-width:46ch;font-size:clamp(17px,2.2vw,20px);margin:0}
section{border-top:1px solid var(--ln);padding:clamp(52px,8vw,88px) 0}
.sec{display:grid;grid-template-columns:1fr;gap:26px}
@media(min-width:860px){.sec{grid-template-columns:240px 1fr;gap:56px}}
.lab{font-weight:400;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.lab span{margin-right:12px;color:var(--red);font-weight:600}
.lbcol{display:flex;flex-direction:column;gap:34px}
.logos{display:flex;flex-direction:row;gap:22px;align-items:flex-start}
.logos img{width:96px;height:auto;display:block}
@media(min-width:860px){.logos{flex-direction:column;gap:36px}.logos img{width:132px}}
.bands{border-top:1px solid var(--ln)}
.band{border-bottom:1px solid var(--ln)}
.band a{display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:center;padding:clamp(34px,6vw,64px) 0;text-decoration:none}
.band h3{font-weight:300;font-size:clamp(34px,6.4vw,72px);line-height:1.04;letter-spacing:-.03em;margin:0}
.band h3 small{font-size:.32em;font-weight:300;letter-spacing:0;margin-left:.7em;color:var(--black)}
.band p{grid-column:1;margin:0;font-size:17px}
.band .go{grid-column:2;grid-row:1/3;font-size:13px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;border:1px solid currentColor;border-radius:999px;padding:9px 18px}
.band:hover .go,.band a:focus-visible .go{background:var(--black);color:#fbf8f2;border-color:var(--black)}
.band h3{color:var(--red)}
.txt{max-width:58ch;font-size:clamp(18px,2.4vw,22px);line-height:1.55;margin:0}
.two{display:grid;grid-template-columns:1fr;border-top:1px solid var(--ln)}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}.two>div+div{border-left:1px solid var(--ln)}}
.two>div{padding:28px 0}
@media(min-width:760px){.two>div{padding:32px 32px 32px 0}.two>div+div{padding-left:32px}}
.two h4{margin:0 0 10px;font-weight:400;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.two p{margin:0;font-size:19px;line-height:1.5}
.pil{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
@media(min-width:760px){.pil{grid-template-columns:repeat(4,1fr)}.pil li+li{border-left:1px solid var(--ln)}}
.pil li{padding:22px 20px 22px 0;font-size:19px}
@media(min-width:760px){.pil li{padding:28px 20px}.pil li:first-child{padding-left:0}}
.pil li+li{border-top:1px solid var(--ln)}
@media(min-width:760px){.pil li+li{border-top:0}}
.pil b{display:block;font-weight:400;font-size:12px;letter-spacing:.18em;margin-bottom:8px;opacity:.85}
.mail{display:inline-block;font-weight:300;font-size:clamp(26px,5vw,48px);letter-spacing:-.02em;text-decoration:none;border-bottom:1px solid var(--black);padding-bottom:4px}
.mail:hover,.mail:focus-visible{color:var(--red);border-color:var(--red)}
footer{padding:36px 0 44px;font-size:14px;border-top:1px solid var(--ln)}
footer .row{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
footer .team{display:flex;gap:18px;align-items:center;font-size:13px}
footer .team span{letter-spacing:.14em;text-transform:uppercase}
footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;text-decoration:underline;text-decoration-color:var(--lnsoft);text-underline-offset:5px}
footer a:hover,footer a:focus-visible{text-decoration-color:var(--red)}
footer .grp{margin-top:28px;padding-top:20px;border-top:1px solid var(--lnsoft);font-size:16px}
footer .grp b{font-weight:800}
a:focus-visible{outline:2px solid currentColor;outline-offset:4px}
@media(max-width:560px){header.top nav{gap:16px}.wrap{padding-left:20px;padding-right:20px}.band .go{padding:8px 14px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.pil .pd{display:block;margin-top:8px;font-size:15px;line-height:1.45;color:#4a3f3f}
.rs{list-style:none;margin:34px 0 0;padding:0;border-top:1px solid var(--lnsoft)}.rs li{border-bottom:1px solid var(--lnsoft)}.rs a{display:flex;align-items:center;gap:12px;padding:14px 0;text-decoration:none;color:inherit;border:0;border-radius:0;letter-spacing:0;min-height:44px}.rs a span{font-size:17px}.rs a small{margin-left:auto;font-size:14px;color:#4a3f3f;text-align:right}.rs a:hover span,.rs a:focus-visible span{color:var(--red)}.rs svg{flex:none}
.volver{display:inline-flex;align-items:center;min-height:48px;margin-top:34px;padding:0 26px;border:1px solid var(--black);border-radius:999px;font-size:14px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.volver:hover,.volver:focus-visible{background:var(--black);color:#fbf8f2}
.cod{color:var(--red);font-weight:600}
.n404 .logos{margin-top:56px}
@media(min-width:860px){.n404 .logos{flex-direction:row;gap:36px;align-items:flex-end}}
.n404 h1{max-width:14ch}
</style>
</head>
<body>

<header class="top on-amber">
  <div class="wrap">
    <div class="right">
      <nav aria-label="Secciones">
        <a href="/">Inicio</a>
      </nav>
    </div>
  </div>
</header>

<main id="inicio" class="n404">
  <div class="on-amber"><div class="wrap hero">
    <p class="eyebrow"><span class="cod">Error 404</span></p>
    <h1>No encontramos esa página</h1>
    <p>Esa dirección no existe en dmalabomba.com. Puede que el enlace esté mal escrito o que la página ya no esté.</p>
    <a class="volver" href="/">Ir al inicio</a>
    <div class="logos"><img src="/logo-soda.svg" alt="Soda La Bomba" width="264" height="278"><img src="/logo-pollos.svg" alt="Pollos La Bomba" width="264" height="264"></div>
  </div></div>
</main>

<footer class="on-red">
  <div class="wrap">
    <div class="row">
      <span>Grupo DMA-La Bomba</span>
      <a href="/">Ir al inicio</a>
    </div>
  </div>
</footer>

</body>
</html>
